<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>examples for xlsx</title>

    <script src="https://cdn.jsdelivr.net/npm/wsemi@1.8.85/dist/wsemi.umd.js"></script>
    <script>
        let log = console.log
        console.log = function(){
            log.apply(null, arguments)
            wsemi.bodyLog.apply(null, arguments)
        }
    </script>

</head>
<body>

    <div style="margin-bottom:20px;">

        <div>

            <button onclick="downloadMat()">download file(*.xlsx) from mat</button>

            <button onclick="downloadLtdt()">download file(*.xlsx) from ltdt</button>

        </div>

    </div>

    <button onclick="readAndDownloadFile()">read file(*.xlsx) and download from xlsx</button>

    <script>

        async function downloadMat(){

            let mat = [
                ['h1', 'h2(中文)', 'h3'],
                ['c11', 'c12', 'c13'],
                ['c21', 'c22', 'c23'],
            ]
            await wsemi.downloadExcelFileFromData('data(mat).xlsx', 'data', mat)
            console.log('download mat')

        }

        async function downloadLtdt(){

            let ltdt = [
                { x: 'a', y: '123', z: 456 },
                { x: 'b', y: '中文', z: 789 },
            ]
            await wsemi.downloadExcelFileFromData('data(ltdt).xlsx', 'data', ltdt)
            console.log('download ltdt')

        }

        function readAndDownloadFile(){

            wsemi.domShowInputAndGetFilesU8Arrs({ kind: 'xlsx' })
                .then(async function(d) {

                    //check, 取消選檔時resolve空陣列, 不視為錯誤
                    if (!d || d.length === 0) {
                        console.log('no file selected')
                        return
                    }

                    //get first file
                    let file = d[0]

                    //u8a
                    let u8a = file.u8a
                    console.log('get u8a', Object.prototype.toString.call(u8a), u8a.length)

                    //download u8a
                    wsemi.downloadFileFromU8Arr('temp.xlsx', u8a)
                    console.log('download u8a')

                    //dcsv
                    let dcsv = await wsemi.getDataFromExcelFileU8Arr(u8a, { fmt: 'csv' })
                    dcsv = dcsv[0]
                    console.log('get csv', dcsv.sheetname, dcsv.data)

                    //download csv
                    wsemi.downloadFileFromText('temp.csv', dcsv.data)
                    console.log('download csv')

                    //dltdt
                    let dltdt = await wsemi.getDataFromExcelFileU8Arr(u8a, { fmt: 'ltdt' })
                    dltdt = dltdt[0]
                    console.log('get dltdt', dltdt.sheetname, dltdt.data)

                    //download json
                    wsemi.downloadFileFromText('temp.json', JSON.stringify(dltdt))
                    console.log('download json(from dltdt)')

                    //darray
                    let darray = await wsemi.getDataFromExcelFileU8Arr(u8a, { fmt: 'array' })
                    darray = darray[0]
                    console.log('get array', darray.sheetname, darray.data)

                    //download array
                    await wsemi.downloadExcelFileFromData('temp.array.xlsx', 'data', darray.data)
                    console.log('download array')

                })
                .catch(function(msg){
                    console.log(msg)
                })

        }

    </script>

</body>
</html>
