<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>examples for detectXSSDyn(xss)</title>

    <script src="https://cdn.jsdelivr.net/npm/wsemi@1.9.33/dist/wsemi.umd.js"></script>
    <script>
        let log = console.log
        console.log = function(){
            log.apply(null, arguments)
            wsemi.bodyLog.apply(null, arguments)
        }
    </script>

</head>
<body>

    <script>
        let core = async () => {
            let r
            r = await wsemi.detectXSSDyn('<img src=x onerror=alert(1)>')
            console.log("detectXSSDyn('<img src=x onerror=alert(1)>')",r)
            r = await wsemi.detectXSSDyn('<a href="jav&#x09;ascript:alert(1)">點我</a>')
            console.log("detectXSSDyn('<a href=\"jav&#x09;ascript:alert(1)\">點我</a>')",r)
        }
        core()
            .then((res)=>{
                // console.log('detectXSSDyn',res)
            })
            .catch((err)=>{
                console.log(err)
            })

    </script>

</body>
</html>
